<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Mercotruck Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo_mercotruck.svg">
  <link rel="alternate icon" type="image/png" href="/static/images/mercotruck_icon.png">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(900px 500px at 50% -8%, rgba(8, 58, 71, 0.72) 0%, rgba(12, 28, 35, 0) 70%),
        radial-gradient(600px 400px at 85% 95%, rgba(232, 49, 0, 0.08) 0%, rgba(12, 28, 35, 0) 65%),
        #0C1C23;
      margin: 0;
      padding: 1.5rem;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: #F4F6F8;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrapper {
      width: 100%;
      max-width: 26.5rem;
      animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .login-logo-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .login-wordmark {
      height: 2.35rem;
      width: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.35));
    }

    .login-badge {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #F4F6F8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .login-tagline {
      font-size: 0.875rem;
      color: rgba(244, 246, 248, 0.68);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.055);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 1.25rem;
      padding: 2.25rem 2.15rem;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 24px 48px -12px rgba(0, 0, 0, 0.45),
        0 8px 16px -6px rgba(0, 0, 0, 0.28);
    }

    .login-title {
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin: 0 0 0.3rem 0;
      text-align: center;
      text-wrap: balance;
    }

    .login-subtitle {
      font-size: 0.8125rem;
      color: rgba(244, 246, 248, 0.62);
      text-align: center;
      margin-bottom: 1.65rem;
    }

    .login-alert {
      background: rgba(232, 49, 0, 0.14);
      border: 1px solid rgba(232, 49, 0, 0.45);
      color: #FECACA;
      padding: 0.75rem 0.95rem;
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .form-group-login {
      margin-bottom: 1.1rem;
    }

    .form-label-login {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgba(244, 246, 248, 0.85);
      margin-bottom: 0.4rem;
    }

    .input-login {
      width: 100%;
      padding: 0.75rem 0.95rem;
      background: rgba(12, 28, 35, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0.7rem;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-sizing: border-box;
    }

    .input-login::placeholder {
      color: rgba(244, 246, 248, 0.38);
    }

    .input-login:focus {
      border-color: #2BA8BF;
      box-shadow: 0 0 0 3px rgba(43, 168, 191, 0.22);
      background: rgba(12, 28, 35, 0.88);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1.15rem 0 1.5rem 0;
      font-size: 0.8125rem;
      color: rgba(244, 246, 248, 0.72);
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-label input[type="checkbox"] {
      accent-color: #083A47;
      width: 0.95rem;
      height: 0.95rem;
    }

    .btn-login {
      width: 100%;
      padding: 0.82rem 1.25rem;
      background: #083A47;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 0.75rem;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.12) inset,
        0 10px 24px -6px rgba(8, 58, 71, 0.65);
    }

    .btn-login:hover:not(:disabled) {
      background: #0B4D5E;
      transform: translateY(-1px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 14px 28px -6px rgba(8, 58, 71, 0.8);
    }

    .login-footer {
      text-align: center;
      margin-top: 1.65rem;
      font-size: 0.75rem;
      color: rgba(244, 246, 248, 0.45);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-logo-row">
        <img src="/static/images/mercotruck_logo_white.png" alt="Mercotruck" class="login-wordmark">
        <span class="sr-only">Mercotruck</span>
        <span class="login-badge">Radar</span>
      </div>
      <div class="login-tagline">
        Inteligencia de Mercado &amp; Tarifas FTL
      </div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Acceso Corporativo</h1>
      <p class="login-subtitle">Ingresa con tu cuenta ejecutiva de Mercotruck</p>

      {% if error %}
      <div class="login-alert" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next or '/dashboard' }}">

        <div class="form-group-login">
          <label class="form-label-login" for="emailInput">Correo electrónico</label>
          <input 
            type="text" 
            id="emailInput" 
            name="email" 
            value="{{ email_val or '' }}" 
            placeholder="usuario@mercotruck.com" 
            required 
            autocomplete="username" 
            class="input-login"
          >
        </div>

        <div class="form-group-login">
          <label class="form-label-login" for="passwordInput">Contraseña</label>
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password" 
            class="input-login"
          >
        </div>

        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" name="remember_me" value="true" checked>
            <span>Mantener sesión iniciada (7 días)</span>
          </label>
        </div>

        <button type="submit" class="btn-login">
          <span>Ingresar al Radar</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

    </div>

    <div class="login-footer">
      &copy; 2026 Mercotruck S.R.L. — Mercotruck Radar
    </div>
  </div>

</body>
</html>
