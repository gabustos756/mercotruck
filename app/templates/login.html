<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — crossTruck Enterprise</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.2.0">
  <link rel="icon" href="/static/images/logo_crosstruck.jpg">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      margin: 0;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .login-badge {
      font-size: 0.725rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 0.4rem;
      background: linear-gradient(135deg, #06b6d4 0%, #1B5E6B 100%);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .login-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.825rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group-login {
      margin-bottom: 1.2rem;
    }

    .form-label-login {
      display: block;
      font-size: 0.775rem;
      font-weight: 700;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 0.4rem;
    }

    .input-login {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.6rem;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .input-login:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      user-select: none;
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #1B5E6B 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(6, 182, 212, 0.4);
      filter: brightness(1.05);
    }

    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="login-logo" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
        <img src="/static/images/logo_crosstruck.jpg" alt="crossTruck" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover;">
        <span>crossTruck</span> <span class="login-badge" style="background: #059669;">Enterprise</span>
      </div>
      <div class="login-tagline">
        Inteligencia Logística & Pricing Dinámico
      </div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Portal de Clientes</h1>

      {% if error %}
      <div class="login-alert">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next or '/dashboard' }}">

        <div class="form-group-login">
          <label class="form-label-login" for="emailInput">Correo Electrónico</label>
          <input 
            type="text" 
            id="emailInput" 
            name="email" 
            value="{{ email_val or '' }}" 
            placeholder="usuario@tuempresa.com" 
            required 
            autocomplete="username" 
            class="input-login"
          >
        </div>

        <div class="form-group-login">
          <label class="form-label-login" for="passwordInput">Contraseña</label>
          <input 
            type="password" 
            id="passwordInput" 
            name="password" 
            placeholder="••••••••••••" 
            required 
            autocomplete="current-password" 
            class="input-login"
          >
        </div>

        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" name="remember_me" value="true" checked>
            <span>Recordar mi sesión (7 días)</span>
          </label>
          <a href="/" style="color: #94a3b8; font-size: 0.8rem; text-decoration: none;">← Volver al Inicio</a>
        </div>

        <button type="submit" class="btn-login" style="background: #059669;">
          Ingresar al Panel ➔
        </button>
      </form>

    </div>

    <div class="login-footer">
      &copy; 2026 crossTruck Enterprise. Todos los derechos reservados.
    </div>
  </div>

</body>
</html>
